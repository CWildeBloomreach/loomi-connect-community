name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_skills.py
      # The Klaviyo converter's build tests need beautifulsoup4 and jinja2, in the venv its own setup creates.
      - run: python3 plugins/loomi-engagement/skills/convert-klaviyo-email-to-bloomreach/scripts/klaviyo_to_bloomreach.py setup --venv "$RUNNER_TEMP/klaviyo-venv"
      - run: '"$RUNNER_TEMP/klaviyo-venv/bin/pip" install beautifulsoup4 jinja2'
      - run: python3 -m unittest discover -s tests -t . -v
        env:
          KLAVIYO_TEST_VENV: ${{ runner.temp }}/klaviyo-venv

  # Every commit in a PR must be signed off by its author. See "Sign-off" in CONTRIBUTING.md.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no 'Signed-off-by: $author' line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with 'git rebase --signoff $BASE', then 'git push --force-with-lease'. See CONTRIBUTING.md."
            exit 1
          fi
